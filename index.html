<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGol - Cruzeiro</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="icon" href="../Imagens/favicon.ico">
</head>
<body>
    <div id="game-container">
        <!-- Área principal do jogo com perspectiva 2.5D -->
        <div id="game-area">
            
            <!-- Torcida gerada pelo JS -->
            <div id="stadium-crowd"></div>
            
            <!-- Gramado/Campo inclinado -->
            <div class="field"></div>
            
            <!-- Elementos 3D (Bonecos e Bola) -->
            <div id="goleiro" class="goleiro"></div>
            <div id="bola" class="bola"></div>
            <div id="jogador" class="boneco"></div>
            
        </div>

        <!-- Interface de Usuário (Placar e Perguntas) fora da perspectiva 3D -->
        <div id="ui-container">
            <div id="header-ui">
                <img src="../Imagens/hexatech-logo.png" alt="Hexatech Logo" class="logo">
                <div id="placar">Gols: <span id="score">0</span></div>
            </div>
            
            <div id="painel-pergunta">
                <h2 id="pergunta-texto">Carregando pergunta...</h2>
                <div id="opcoes-container">
                    <!-- Botões gerados via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts do jogo -->
    <script type="module" src="../JS/firebase-config.js"></script>
    <script type="module" src="../JS/data.js"></script>
    <script type="module" src="../JS/banco-questoes.js"></script>
    <script type="module" src="../JS/sfx.js"></script>
    <script type="module" src="../JS/game.js"></script>
</body>
</html>
