<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>MathGol — Cobrança de pênalti com matemática</title>
<meta name="description" content="MathGol: fase de pênaltis com perguntas de matemática, para crianças.">

<link rel="icon" type="image/x-icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="campo-animado" aria-hidden="true">
  <svg class="cena-gol" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="ceuGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0B1E3D"/>
        <stop offset="100%" stop-color="#1E5B96"/>
      </linearGradient>
      <linearGradient id="gramaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1F7A45"/>
        <stop offset="100%" stop-color="#39B26A"/>
      </linearGradient>
      <radialGradient id="brilhoBola" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFE38A" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#FFE38A" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="0" y="0" width="400" height="808" fill="url(#ceuGrad)"/>
    <polygon points="0,0 90,0 10,420 -60,420" fill="#FFFFFF" opacity="0.035"/>
    <polygon points="400,0 320,0 380,460 460,460" fill="#FFFFFF" opacity="0.035"/>
    <circle cx="55" cy="70" r="18" fill="#FFFFFF" opacity="0.06"/>
    <circle cx="340" cy="120" r="24" fill="#FFFFFF" opacity="0.05"/>
    <circle cx="200" cy="60" r="14" fill="#FFFFFF" opacity="0.05"/>
    <circle cx="90" cy="260" r="26" fill="#FFFFFF" opacity="0.04"/>
    <circle cx="320" cy="340" r="18" fill="#FFFFFF" opacity="0.04"/>
    <circle cx="160" cy="440" r="30" fill="#FFFFFF" opacity="0.035"/>
    <circle cx="280" cy="560" r="20" fill="#FFFFFF" opacity="0.04"/>
    <circle cx="70" cy="620" r="16" fill="#FFFFFF" opacity="0.04"/>
    <circle cx="230" cy="700" r="22" fill="#FFFFFF" opacity="0.045"/>

    <rect x="0" y="808" width="400" height="92" fill="url(#gramaGrad)"/>
    <rect x="0" y="808" width="400" height="14" fill="#FFFFFF" opacity="0.04"/>
    <rect x="0" y="836" width="400" height="14" fill="#FFFFFF" opacity="0.05"/>
    <rect x="0" y="864" width="400" height="16" fill="#FFFFFF" opacity="0.06"/>
    <path d="M 150 900 Q 200 860 250 900" fill="none" stroke="#FFFDF6" stroke-width="2" opacity="0.35"/>

    <g class="gol">
      <rect x="296" y="760" width="82" height="48" fill="#FFFFFF" opacity="0.12"/>
      <g stroke="#FFFDF6" stroke-width="1" opacity="0.45">
        <line x1="302" y1="762" x2="302" y2="808"/><line x1="312" y1="762" x2="312" y2="808"/>
        <line x1="322" y1="762" x2="322" y2="808"/><line x1="332" y1="762" x2="332" y2="808"/>
        <line x1="342" y1="762" x2="342" y2="808"/><line x1="352" y1="762" x2="352" y2="808"/>
        <line x1="362" y1="762" x2="362" y2="808"/><line x1="372" y1="762" x2="372" y2="808"/>
        <line x1="296" y1="770" x2="378" y2="770"/><line x1="296" y1="780" x2="378" y2="780"/>
        <line x1="296" y1="790" x2="378" y2="790"/><line x1="296" y1="800" x2="378" y2="800"/>
      </g>
      <rect x="294" y="758" width="5" height="50" fill="#FFFDF6"/>
      <rect x="375" y="758" width="5" height="50" fill="#FFFDF6"/>
      <rect x="294" y="758" width="86" height="5" fill="#FFFDF6"/>
    </g>

    <g class="goleiro-base" transform="translate(337,803)">
      <g class="goleiro">
        <circle cx="0" cy="-32" r="7" fill="#E8B98C"/>
        <rect x="-9" y="-25" width="18" height="23" rx="4" fill="#6CACE4"/>
        <rect x="-3" y="-25" width="2" height="23" fill="#FFFDF6" opacity="0.85"/>
        <rect x="1" y="-25" width="2" height="23" fill="#FFFDF6" opacity="0.85"/>
        <rect x="-16" y="-24" width="8" height="5" rx="2" fill="#FFFDF6"/>
        <rect x="8" y="-24" width="8" height="5" rx="2" fill="#FFFDF6"/>
        <circle cx="-17" cy="-21" r="3.5" fill="#FFFDF6"/>
        <circle cx="17" cy="-21" r="3.5" fill="#FFFDF6"/>
        <rect x="-8" y="-3" width="6" height="15" rx="2" fill="#21303B"/>
        <rect x="2" y="-3" width="6" height="15" rx="2" fill="#21303B"/>
      </g>
    </g>

    <text class="texto-gol" x="336" y="748" text-anchor="middle">GOL!</text>

    <circle class="bola-eco bola-eco-1" r="9" fill="url(#brilhoBola)"/>
    <circle class="bola-eco bola-eco-2" r="7" fill="url(#brilhoBola)"/>
    <circle class="bola-eco bola-eco-3" r="5" fill="url(#brilhoBola)"/>

    <g class="jogador" transform="translate(58,890)">
      <circle cx="0" cy="-46" r="9" fill="#E8B98C"/>
      <rect x="-10" y="-37" width="20" height="26" rx="5" fill="#F7CF3D"/>
      <text x="0" y="-21" text-anchor="middle" font-size="9" font-weight="700" fill="#1E7A46" font-family="Fredoka, sans-serif">7</text>
      <rect x="-9" y="-11" width="8" height="12" rx="2" fill="#1D3E8C"/>
      <rect x="-9" y="-1" width="8" height="4" rx="1" fill="#FFFDF6"/>
      <g class="perna-chute">
        <rect x="1" y="-11" width="8" height="12" rx="2" fill="#1D3E8C"/>
        <rect x="1" y="-1" width="8" height="4" rx="1" fill="#FFFDF6"/>
      </g>
    </g>

    <g class="bola">
      <circle r="7" fill="#FFFDF6" stroke="#21303B" stroke-width="1.3"/>
      <path d="M0,-4 3,-1 2,3 -2,3 -3,-1 Z" fill="#21303B" opacity="0.85"/>
    </g>
  </svg>
</div>

<div class="fundo-tematico" aria-hidden="true">
  <span class="item-flutuante item-1">5+5</span>
  <span class="item-flutuante item-3">7−2</span>
  <span class="item-flutuante item-5">3×2</span>
  <span class="item-flutuante item-6">9÷3</span>
  <span class="item-flutuante item-7">6+4</span>
  <span class="item-flutuante item-9">8−3</span>
  <span class="item-flutuante item-10">4×2</span>
  <span class="item-flutuante item-13">2+6</span>
  <span class="item-flutuante item-14">10−1</span>
</div>

<div id="app">

  <div class="topo">
    <img id="logo-mini" class="marca-logo" src="hexatech-logo.png" alt="HexaTech">
    <button id="botao-acessibilidade" class="botao-icone" type="button" aria-label="Abrir opções de acessibilidade">♿</button>
  </div>

  <section id="tela-menu" class="tela tela-menu">
    <img class="logo-hero" src="hexatech-logo-hero.png" alt="HexaTech">
    <svg class="mascote mascote-grande" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#FFFDF6" stroke="#21303B" stroke-width="5"/>
      <polygon points="50,28 63,38 58,54 42,54 37,38" fill="#21303B"/>
      <circle cx="34" cy="40" r="4.5" fill="#21303B"/>
      <circle cx="66" cy="40" r="4.5" fill="#21303B"/>
      <path d="M35 60 Q50 74 65 60" stroke="#21303B" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>MathGol</h1>
    <p class="subtitulo subtitulo-curto">Chuta, acerta e faz o gol! ⚽</p>
    <div class="pilha-botoes">
      <button id="botao-jogar" class="botao botao-cta" type="button">Jogar</button>
    </div>
  </section>

  <section id="tela-apelido" class="tela tela-personalizar">
    <h2>Personalize seu craque</h2>
    <span class="selo">🔒 Sem nome real</span>

    <div class="preview-personalizar">
      <div class="avatar-apelido" id="avatar-apelido" aria-hidden="true">
        <img id="avatar-img" class="avatar-img" src="" alt="">
      </div>
      <div class="campo-apelido">
        <label for="input-apelido" class="rotulo-campo">Seu apelido de craque</label>
        <div class="linha-apelido">
          <input id="input-apelido" class="input-apelido" type="text" maxlength="20" autocomplete="off" spellcheck="false" inputmode="text">
          <button id="botao-sortear-apelido" class="botao-icone" type="button" aria-label="Sortear novo apelido">🎲</button>
        </div>
      </div>
    </div>

    <h3 class="subtitulo-secao">Escolha seu avatar</h3>
    <div id="abas-avatar" class="abas-avatar"></div>
    <div id="grade-avatares" class="grade-avatares"></div>

    <div class="pilha-botoes" style="margin-top: 20px;">
      <button id="botao-confirmar-apelido" class="botao" type="button">Confirmar ✅</button>
    </div>
  </section>

  <section id="tela-selecao" class="tela">
    <h2>Escolha seu time</h2>
    <div id="grade-selecoes" class="grade-cartoes"></div>
    <div class="pilha-botoes" style="margin-top: 24px;">
      <button id="botao-confirmar-selecao" class="botao" type="button" disabled>Confirmar ✅</button>
    </div>
  </section>

  <section id="tela-dificuldade" class="tela">
    <h2>Nível do desafio</h2>
    <div id="grade-dificuldades" class="grade-cartoes"></div>
    <div class="pilha-botoes" style="margin-top: 24px;">
      <button id="botao-confirmar-dificuldade" class="botao" type="button" disabled>Bora jogar! ⚽</button>
    </div>
  </section>

  <section id="tela-fase1" class="tela">
    <div id="cabecalho-fase" class="cabecalho-fase"></div>
    <div class="caixa-pergunta">
      <p id="pergunta-texto" class="pergunta-texto">—</p>
    </div>
    <div class="palco-penalti">
      <div id="jogo-penalti"></div>
      <div id="zonas-gol" class="zonas-gol">
        <button class="botao-zona zona-topo-esquerda" type="button" data-zona="topo-esquerda">—</button>
        <button class="botao-zona zona-topo-direita" type="button" data-zona="topo-direita">—</button>
        <button class="botao-zona zona-meio" type="button" data-zona="meio">—</button>
        <button class="botao-zona zona-baixo-esquerda" type="button" data-zona="baixo-esquerda">—</button>
        <button class="botao-zona zona-baixo-direita" type="button" data-zona="baixo-direita">—</button>
      </div>
    </div>
    <p id="mensagem-feedback" class="mensagem-feedback"></p>
  </section>

  <section id="tela-resultado" class="tela">
    <h2>Fim da Fase 1!</h2>
    <p id="placar-final" class="placar-grande">0 / 3</p>
    <p id="resumo-resultado" class="resumo-resultado">—</p>
    <div class="pilha-botoes">
      <button id="botao-voltar-menu" class="botao" type="button">Voltar ao menu</button>
    </div>
  </section>

</div>

<footer class="rodape">
  <span class="rodape-texto">Um jogo</span>
  <img class="rodape-logo" src="hexatech-logo.png" alt="HexaTech">
</footer>

<div id="sobreposicao-acessibilidade" class="sobreposicao">
  <div class="painel-acessibilidade">
    <h2 style="text-align:left; margin-bottom:16px;">Acessibilidade</h2>
    <div class="linha-opcao">
      <label for="opcao-alto-contraste">Alto contraste</label>
      <span class="alternador"><input type="checkbox" id="opcao-alto-contraste"><span class="trilho-alternador"></span></span>
    </div>
    <div class="linha-opcao">
      <label for="opcao-espaco-dislexia">Espaçamento para dislexia</label>
      <span class="alternador"><input type="checkbox" id="opcao-espaco-dislexia"><span class="trilho-alternador"></span></span>
    </div>
    <div class="linha-opcao">
      <label for="opcao-narracao">Narração em áudio</label>
      <span class="alternador"><input type="checkbox" id="opcao-narracao"><span class="trilho-alternador"></span></span>
    </div>
    <div class="pilha-botoes" style="margin-top: 20px;">
      <button id="botao-fechar-acessibilidade" class="botao" type="button">Fechar</button>
    </div>
  </div>
</div>

<!-- Firebase (módulo ES — carrega antes dos scripts do jogo) -->
<script type="module" src="firebase-config.js"></script>

<!-- Phaser 3 (CDN — degrada graciosamente se falhar) -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<!-- Scripts do jogo (ordem importa: data → avatar-data → questions → narration → game → main) -->
<script src="data.js"></script>
<script src="avatar-data.js"></script>
<script src="questions.js"></script>
<script src="narration.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
